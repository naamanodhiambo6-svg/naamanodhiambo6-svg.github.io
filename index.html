
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Mwananchi V25 - Final Fix</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}
.header{padding:12px;background:#111;display:flex;justify-content:space-between;border-bottom:1px solid #222}
.chat{flex:1;overflow-y:auto;padding:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;margin:7px 0;line-height:1.4;white-space:pre-wrap;font-size:13px}
.user{background:#0066ff;margin-left:auto}
.bot{background:#1e1e1e;margin-right:auto;border:1px solid #333}
.input{display:flex;padding:10px;background:#111;gap:8px}
.input input{flex:1;padding:12px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;outline:none}
.input button{padding:12px 18px;border-radius:20px;border:none;background:#0066ff;color:#fff;font-weight:bold}
img.gen{max-width:100%;border-radius:12px;margin-top:8px}
</style>
</head>
<body>
<div class="header"><div>🌍 <b>Mwananchi V25</b><br><small style="color:#22ff88">All Bugs Fixed</small></div><div>V25</div></div>
<div class="chat" id="chat"></div>
<div class="input"><input id="q" placeholder="Try: How are you, Who is you" onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Send</button></div>

<script>
function getAnswer(text){
 let t = text.toLowerCase().trim();

 // GREETINGS + HOW ARE YOU - FIX FOR TODAY SCREENSHOT!
 if(t.match(/^(hello|hi|hey|hallo)\b/) || t.includes("how are you") || t.includes("how r you") || t.includes("how is you") || t.includes("mambo") || t.includes("poa") || t.includes("habari") || t.includes("niaje") || t.includes("sasa")){
   if(t.includes("how are you") || t.includes("how r you") || t.includes("how is you")){
     return "Poa sana bro! Mambo fiti! 😊 Niko poa V25, no bugs!\nWewe uko aje Litein? Mayai inaenda aje?\nUliza kitu - 'mayai' au 'image: mayai shop'";
   }
   return "Poa bro! V25 here! 🌍 All bugs fixed!\n✅ Hello works\n✅ How are you works\n✅ Who is you works\nTry 'How are you' now!";
 }

 // IDENTITY - ALL VARIATIONS
 if(t.includes("who is you") || t.includes("who are you") || t.includes("who is u") || t.includes("who are u") || t.includes("who r you") || t.includes("who r u") || t.includes("wewe ni nani") || t.includes("unaitwa nani") || t.includes("jina lako") || (t.includes("who") && t.includes("you"))){
   return "Mimi ni Mwananchi V25 bro! 🌍\nFrom Litein, built by you Naaman!\nV25 = FINAL, no bug like V23!\n50 tools + Real image gen!\nTry: 'image: mayai shop'";
 }

 if(t.includes("made you") || t.includes("who made") || t.includes("how made")) return "Wewe bro! Naaman from Litein! 👊 You made me V25! From V21 to V25 fixed!";

 if(t.includes("mayai") && !t.includes("image")){
   let n=text.match(/\d+/); let trays=n?parseInt(n[0]):3; if(trays==2026||trays>100) trays=3;
   return `Mayai Litein 2026 🥚 V25:\n${trays} tray = Buy ${trays*550} / Sell ${trays*700} / Profit ${trays*150}`;
 }

 if(t.includes("image:") || t.includes("picha:")){
   let p=text.replace(/image:|picha:/gi,"").trim() || "Mayai shop Litein";
   return "__IMAGE__"+p;
 }

 return `V25 got: '${text}'\n✅ Fixed all: Hello, Hi, How are you, Who is you`;
}

function ask(){
 const el=document.getElementById('q'); let txt=el.value.trim(); if(!txt) return;
 addMsg(txt,'user'); el.value='';
 let ans=getAnswer(txt);
 if(ans.startsWith("__IMAGE__")){
   let prompt=ans.replace("__IMAGE__",""); 
   addMsg("Creating: "+prompt+" 🎨", 'bot');
   let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + " realistic")}?nologo=true&seed=${Math.floor(Math.random()*10000)}`;
   const d=document.getElementById('chat'); const div=document.createElement('div'); div.className='msg bot'; div.innerHTML=`<img class="gen" src="${url}">`; d.appendChild(div); d.scrollTop=d.scrollHeight;
 } else addMsg(ans,'bot');
}
function addMsg(t,c){ const d=document.getElementById('chat'); const div=document.createElement('div'); div.className='msg '+c; div.innerText=t; d.appendChild(div); d.scrollTop=d.scrollHeight; }
addMsg("V25 LOADED! 🌍 FINAL FIX!\n✅ Hello, Hi = works\n✅ How are you = NOW WORKS (was bug in your screenshot)\n✅ Who is you = works\n\nType 'How are you' again now!","bot");
</script>
</body>
</html>
