
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mwananchi AI</title>
<style>
body{margin:0;font-family:Arial;background:#0a0e13;color:#fff}
.top{background:linear-gradient(90deg,#00c853,#2962ff);padding:20px;text-align:center;font-weight:800;font-size:22px}
.tabs{display:flex;gap:6px;overflow:auto;padding:10px}
.tab{padding:8px 14px;border-radius:20px;background:#1e2a38;color:#fff;border:0;font-weight:600}
.tab.active{background:#00c853}
.card{background:#151a21;margin:12px;padding:14px;border-radius:14px;border:1px solid #263238}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gbtn{padding:12px;border-radius:10px;border:0;font-weight:700;color:#fff}
.msg{margin:8px 0;padding:10px 12px;border-radius:12px;font-size:14px;max-width:85%}
.me{background:#2962ff;margin-left:auto}
.ai{background:#232e35}
.row{display:flex;gap:8px;margin-top:10px;background:#000;padding:6px;border-radius:20px}
.row input{flex:1;background:transparent;border:0;color:#fff;padding:8px;outline:none}
.send{width:40px;height:40px;border-radius:50%;background:#00c853;border:0;color:#fff}
.chat{max-height:260px;overflow:auto}
.badge{background:#c8e6c9;padding:5px 12px;border-radius:8px;color:#000;font-size:12px}
</style>
</head>
<body>
<div class="top">🇰🇪 Mwananchi AI - Eldoret</div>
<div class="tabs">
<button class="tab active">🌱 Shamba</button>
<button class="tab">💼 Biashara</button>
<button class="tab">💻 Kazi</button>
<button class="tab">🏥 Huduma</button>
</div>
<div class="card">
<div class="grid">
<button class="gbtn" style="background:#00c853" onclick="quick('shamba')">🌱 Shamba</button>
<button class="gbtn" style="background:#2962ff" onclick="quick('biashara')">💼 Biashara</button>
<button class="gbtn" style="background:#ff6d00" onclick="quick('kazi')">💻 Kazi</button>
<button class="gbtn" style="background:#6200ea" onclick="quick('huduma')">🏥 Huduma</button>
</div>
<p style="font-size:13px;color:#aaa;margin-top:10px">💡 KCSE Tip: Soma 2hrs asubuhi!</p>
</div>
<div class="card">
<b>💬 Uliza Mwananchi AI <span style="color:#00e676">● Live</span></b>
<div class="chat" id="msgs"><div class="msg ai">Habari! Mimi ni Mwananchi AI. Uliza kuhusu Shamba, Biashara, Kazi — nitajibu!</div></div>
<div class="row"><input id="in" placeholder="Habari..."><button class="send" id="sb">➤</button></div>
</div>
<div class="card"><b>📊 Soko Live Eldoret</b><br><br>🥔 Viazi: Ksh 80/kg ↗<br>🌽 Mahindi: Ksh 65/kg<br>🍅 Nyanya: Ksh 120/kg</div>
<div style="text-align:center;padding:20px;color:#78909c;font-size:12px">Built by Naaman Odhiambo 🇰🇪</div>
<script>
let M=document.getElementById('msgs'),I=document.getElementById('in'),B=document.getElementById('sb');
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;M.appendChild(d);M.scrollTop=M.scrollHeight}
function quick(t){let m={shamba:'Bei za shamba?',biashara:'Idea ya biashara',kazi:'Kazi online',huduma:'NHIF info'}[t];I.value=m;send()}
function send(){let v=I.value.trim();if(!v)return;add(v,'me');I.value='';setTimeout(()=>{let l=v.toLowerCase(),r='Niko hapa! Uliza Shamba, Biashara, Kazi.';if(l.includes('shamba')||l.includes('viazi')||l.includes('bei'))r='🌱 Shamba Eldoret: Viazi 80, Mahindi 65, Nyanya 120. Lima asubuhi!';else if(l.includes('biashara')||l.includes('biz')||l.includes('pesa'))r='💼 Biz 10k: Mitumba online, Mayai, Juice bar. Unataka gani?';else if(l.includes('kazi')||l.includes('job'))r='💻 Kazi: Data entry, Canva design, Transcription. Skill gani?';else if(l.includes('habari')||l.includes('mambo'))r='Poa sana! Niko fiti 😊 Uliza!';add(r,'ai')},500)}
B.onclick=send;I.onkeydown=e=>{if(e.key==='Enter')send()}
</script>
</body>
</html>
