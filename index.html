
<!DOCTYPE html>
<html>
<head>
<title>Mwananchi AI - Global</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}
.header{padding:15px;background:#111;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222}
.header img{width:35px;height:35px;border-radius:50%}
.chat{flex:1;overflow-y:auto;padding:15px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;margin:8px 0;line-height:1.4}
.user{background:#0066ff;margin-left:auto;border-bottom-right-radius:4px}
.bot{background:#1a1a1a;margin-right:auto;border-bottom-left-radius:4px;white-space:pre-wrap}
.input{display:flex;padding:10px;background:#111;gap:10px}
.input input{flex:1;padding:12px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;outline:none}
.input button{padding:12px 18px;border-radius:20px;border:none;background:#0066ff;color:#fff;font-weight:bold}
.typing{font-size:12px;color:#888;padding:0 15px 5px}
</style>
</head>
<body>
<div class="header">
<img src="https://i.ibb.co/placeholder-your-logo.png" id="logo">
<div><b id="appName">Mwananchi AI</b><br><small style="color:#888">5 Super Brains • Global</small></div>
</div>
<div class="chat" id="chat"></div>
<div class="typing" id="typing"></div>
<div class="input">
<input id="q" placeholder="Uliza kitu... (bei, biashara, sheng)" onkeydown="if(event.key==='Enter')ask()">
<button onclick="ask()">Send</button>
</div>

<script>
// ===== V14 GLOBAL FINAL - 5 SUPER BRAINS =====
const BRAINS = [
  {name:"Human Talker", model:"openai", sys:"You are Mwananchi AI V14. Rules: # NEVER write long essay. #### Talk like human, short, 1-2 lines max. [] Use Sheng sometimes. \" Be friendly, say 'bro', 'poa'. Always answer short like WhatsApp. No bullet points unless asked. Act like Kenyan youth from Litein but global mind."},
  {name:"Business", model:"openai", sys:"You are business brain. # Give direct answer with numbers. #### Example: 'Tray 3 @550 = 1650 profit 1050'. [] No story. \" Short."},
  {name:"Fact Checker", model:"mistral", sys:"You are anti-lie brain. # If you don't know, say 'Sina uhakika bro, but...' #### Never invent Cloudscape 5Tbps or fake price. \" Short."},
  {name:"Sheng Master", model:"openai", sys:"You translate to Sheng, human style. # 1-2 sentences. #### Use: poa, msee, rada, form, doh."},
  {name:"Global", model:"openai", sys:"You are global brain. # Answer in English if user uses English, Swahili if Swahili. #### Be useful worldwide."}
];

let memory = [];

async function ask(){
 const input = document.getElementById('q');
 const text = input.value.trim(); if(!text) return;
 addMsg(text,'user'); input.value='';
 document.getElementById('typing').innerText = "5 brains thinking...";
 
 // Pick best brain based on keyword
 let brain = BRAINS[0];
 if(text.includes("bei")||text.includes("profit")||text.includes("biashara")) brain = BRAINS[1];
 if(text.includes("sheng")||text.includes("slang")) brain = BRAINS[3];
 if(text.match(/[a-z]{3,}/i) && text.length < 10) brain = BRAINS[0]; // short greeting
 
 try{
  const best = await callBrain(brain, text);
  addMsg(best,'bot');
 }catch(e){ addMsg("Bro network kidogo... jaribu tena 🙏",'bot'); }
 document.getElementById('typing').innerText = "";
}

async function callBrain(brain, text){
 // Anti-essay + Human trick: V14 prompt injection
 const finalPrompt = `${brain.sys}\n\nUser: ${text}\nContext: ${memory.slice(-3).join(" | ")}\n\nIMPORTANT: ${brain.sys.includes("#") ? "Use # for title only if needed, #### for subtitle, [] for highlight, use quotes for emphasis. Keep under 40 words!" : ""}\nAnswer:`;
 
 const url = `https://text.pollinations.ai/${encodeURIComponent(finalPrompt)}?model=${brain.model}&seed=${Math.floor(Math.random()*1000)}`;
 const res = await fetch(url);
 let ans = await res.text();
 
 // V14 Cleanup - Make human!
 ans = ans.replace(/[#*`_]{2,}/g,"").substring(0,300); // No essay!
 ans = ans.split("\n").slice(0,4).join("\n"); // Max 4 lines!
 memory.push(text);
 if(memory.length>6) memory.shift();
 return ans.trim();
}

function addMsg(t,c){
 const d=document.getElementById('chat');
 const div=document.createElement('div');
 div.className='msg '+c; div.innerText=t;
 d.appendChild(div); d.scrollTop=d.scrollHeight;
}

// First msg
addMsg("Poa bro! Mimi ni Mwananchi V14 - 5 super brains, global edition 🌍 Uliza kitu - bei, biashara, ama tu mambo?","bot");
</script>
</body>
</html>
