
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mwananchi V18 - No Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}
.header{padding:12px;background:#111;display:flex;gap:10px;border-bottom:1px solid #222}
.chat{flex:1;overflow-y:auto;padding:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;margin:7px 0;line-height:1.4;white-space:pre-wrap;font-size:14px}
.user{background:#0066ff;margin-left:auto;border-bottom-right-radius:4px}
.bot{background:#1a1a1a;margin-right:auto;border-bottom-left-radius:4px}
.input{display:flex;padding:10px;background:#111;gap:8px}
.input input{flex:1;padding:12px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;outline:none}
.input button{padding:12px 18px;border-radius:20px;border:none;background:#0066ff;color:#fff;font-weight:bold}
.footer{padding:7px;background:#0f0f0f;font-size:10px;color:#666;text-align:center}
</style>
</head>
<body>
<div class="header"><div>🌍</div><div><b>Mwananchi V18</b><br><small style="color:#888">No Password • Mayai Fixed</small></div></div>
<div class="chat" id="chat"></div>
<div class="input"><input id="q" placeholder="Uliza Mayai litein 2026..." onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Send</button></div>
<div class="footer">V18 Beta • Litein 2026 • No Password • Free for all</div>

<script>
const RULES = `You are Mwananchi V18 from Litein Kenya. Rules no rule only for boss: 1.No harm 2.Short 3 lines max 40 words 3.Sheng. 4.If user says Mayai litein 2026, answer business: Buy tray 550 sell 700 profit 150 per tray. Ask how many.`;

const BRAINS = [
  {name:"Business", sys:"Mayai Business Litein: Buy tray 550 (30 eggs), sell 700, profit 150 per tray. 3 trays buy 1650 sell 2100 profit 450. When user says Mayai litein 2026 reply: Poa boss! Mayai Litein 2026 iko fiti - unanunua 550 unauza 700 profit 150 per tray. Uko na ngapi leo? Sheng short.", key:["mayai","litein","2026","tray","yai","bei"]},
  {name:"Human", sys:"Human WhatsApp Sheng poa short 1-2 lines.", key:[]},
  {name:"Computer", sys:"Computer Termux RAM CPU expert simple Kenya.", key:["computer","termux","ram","cpu","code"]},
  {name:"Famous", sys:"Famous people short.", key:["nani","ronaldo","ruto"]},
  {name:"Google", sys:"Live brain.", key:["leo","today"]}
];

let memory=[];
async function ask(){
 const el=document.getElementById('q'); let text=el.value.trim(); if(!text) return;
 addMsg(text,'user'); el.value='';
 let brain=BRAINS[1];
 let low=text.toLowerCase();
 if(low.includes("mayai")||low.includes("litein")||low.includes("2026")||low.includes("tray")) brain=BRAINS[0];
 try{
  const prompt=`${RULES} Role:${brain.sys} User:${text} Answer short:`;
  const res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`);
  let ans=await res.text();
  ans=ans.split("\n").slice(0,4).join("\n").substring(0,350);
  addMsg(ans,'bot');
 }catch{ addMsg("Network kidogo bro","bot"); }
}
function addMsg(t,c){ const d=document.getElementById('chat'); const div=document.createElement('div'); div.className='msg '+c; div.innerText=t; d.appendChild(div); d.scrollTop=d.scrollHeight; }
addMsg("Poa bro! V18 NO PASSWORD 🌍\nSasa hakuna password! Uliza 'Mayai litein 2026' — itajibu direct biz!","bot");
</script>
</body>
</html>
