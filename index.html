
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mwananchi AI</title>
<style>
body{margin:0;font-family:Arial;background:#0a0e13;color:#fff}
.top{background:linear-gradient(90deg,#00c853,#2962ff);padding:16px;text-align:center;font-weight:800}
.card{background:#151a21;margin:10px;padding:12px;border-radius:12px}
.msg{margin:6px 0;padding:10px;border-radius:12px;font-size:14px;max-width:85%;white-space:pre-line}
.me{background:#2962ff;margin-left:auto}
.ai{background:#232e35}
.row{display:flex;gap:6px;background:#000;padding:6px;border-radius:20px;margin-top:10px}
.row input{flex:1;background:transparent;border:0;color:#fff;padding:8px;outline:none}
.send{width:38px;height:38px;border-radius:50%;background:#00c853;border:0}
.chat{max-height:320px;overflow:auto}
</style>
</head>
<body>
<div class="top">🇰🇪 Mwananchi AI</div>
<div class="card"><div class="chat" id="c"><div class="msg ai">Mimi naitwa Mwananchi AI msaidizi wa Mwananchi wa kawaida</div></div>
<div class="row"><input id="i" placeholder="Andika..."><button class="send" id="b">➤</button></div></div>
<div class="card"><b>Soko Live</b><br>Viazi 80/kg<br>Mahindi 65/kg</div>
<script>
let C=document.getElementById('c'),I=document.getElementById('i'),B=document.getElementById('b');
function add(t,m){let d=document.createElement('div');d.className='msg '+m;d.innerText=t;C.appendChild(d);C.scrollTop=C.scrollHeight}
function ans(s){
 let l=s.toLowerCase();
 let mt=s.match(/(\d+)\s*([\+\-\*\/xX])\s*(\d+)/);
 if(mt){let a=Number(mt[1]),b=Number(mt[3]),o=mt[2].toLowerCase(),r=0;if(o=='+')r=a+b;if(o=='-')r=a-b;if(o=='*'||o=='x')r=a*b;if(o=='/')r=a/b;return a+" "+o+" "+b+" = "+r}
 if(l.match(/unaitwa|jina|wewe ni nani|who are you/)) return "Mimi naitwa Mwananchi AI msaidizi wa Mwananchi wa kawaida";
 if(l.match(/shamba|maindi|mahindi|viazi|bei/)) return "Soko: Viazi 80/kg, Mahindi 65/kg, Nyanya 120/kg";
 if(l.match(/biashara|10k|20k/)) return "Biashara na 10k: Mitumba online, Mayai Kuku, Juice";
 if(l.match(/kazi|job/)) return "Kazi online: Data Entry $5/hr, Canva, Transcription";
 return "Niko hapa kwa Shamba, Biashara, Kazi, au Hesabu kama 7x4";
}
function send(){let v=I.value.trim();if(!v)return;add(v,'me');I.value='';setTimeout(()=>add(ans(v),'ai'),300)}
B.onclick=send;I.onkeydown=e=>{if(e.key==='Enter')send()}
</script>
</body>
</html>
