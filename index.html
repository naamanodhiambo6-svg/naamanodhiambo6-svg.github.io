
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mwananchi V21 - Ultimate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}
.header{padding:12px;background:#111;display:flex;gap:10px;border-bottom:1px solid #222}
.chat{flex:1;overflow-y:auto;padding:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;margin:7px 0;line-height:1.4;white-space:pre-wrap;font-size:14px}
.user{background:#0066ff;margin-left:auto;border-bottom-right-radius:4px}
.bot{background:#1a1a1a;margin-right:auto;border-bottom-left-radius:4px}
.input{display:flex;padding:10px;background:#111;gap:8px}
.input input{flex:1;padding:12px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;outline:none}
.input button{padding:12px 18px;border-radius:20px;border:none;background:#0066ff;color:#fff;font-weight:bold}
</style>
</head>
<body>
<div class="header"><div>🌍</div><div><b>Mwananchi V21 ULTIMATE</b><br><small style="color:#888">No Bug • All Language</small></div></div>
<div class="chat" id="chat"></div>
<div class="input"><input id="q" placeholder="Uliza chochote..." onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Send</button></div>

<script>
function getAnswer(text){
 let t = text.toLowerCase();

 // HELLO - Fix for your screenshot!
 if(t.match(/^(hello|hi|hey|hallo|salama|niaje|poa|sasa)/)){
   return "Poa bro! Mambo! 🌍 Mimi ni Mwananchi V21 from Litein!\nNiko fiti sana - ready kukusaidia na mayai, biashara, computer!\nUliza kitu bro!";
 }

 // WHO ARE YOU - All versions
 if(t.includes("who are you") || t.includes("wewe ni nani") || t.includes("unaitwa nani") || t.includes("jina lako") || t.includes("unaitwa") || t.includes("what is your name") || t.includes("your name")){
   return "Mimi ni Mwananchi V21 bro! 🌍\nFrom Litein, built by you Naaman!\nJina langu Mwananchi - najua mayai, biashara, computer, shamba!";
 }

 // WHO MADE YOU - Fix for "How made you" typo in screenshot!
 if(t.includes("made you") || t.includes("who made") || t.includes("how made") || t.includes("nani alikutengeneza") || t.includes("ulitengenezwa") || t.includes("created you") || t.includes("who created")){
   return "Wewe bro! Naaman from Litein! 👊 You made me!\nMwananchi V21 ni wako - from Litein to world!\nSio Google, sio Meta - ni biashara yako mwenyewe!";
 }

 if(t.includes("mambo") || t.includes("habari") || t.includes("how are you")){
   return "Poa sana boss! Mambo fiti Litein? 🔥 V21 no limit, no bug!\nUliza mayai, biashara, computer - niko ready!";
 }

 if(t.includes("mayai") || t.includes("litein") || t.includes("2026") || t.includes("tray") || t.includes("yai")){
   let num = text.match(/\d+/);
   let trays = 3;
   if(num){
     let n = parseInt(num[0]);
     if(n>=1 && n<=100 && n!=2026) trays=n;
   }
   return `Mayai Litein 2026 🔥:\n${trays} tray = Buy ${trays*550} / Sell ${trays*700} / Profit ${trays*150}\nUko na ngapi leo bro?`;
 }

 if(t.includes("bei") || t.includes("profit") || t.includes("biashara") || t.includes("pesa") || t.includes("money")){
   return "Biashara poa! 💰\nMayai: 550→700 profit 150/tray\nKienyeji: 500→800 profit 300\nUza ngapi nikuhesabie?";
 }

 if(t.includes("computer") || t.includes("termux") || t.includes("ram") || t.includes("code") || t.includes("app") || t.includes("laptop")){
   return "Computer brain 🖥️:\nV21 hii ume-code mwenyewe! No API limit!\nTermux = coding kwa phone. Unataka V22 na more features?";
 }

 if(t.includes("shamba") || t.includes("kulima") || t.includes("mahindi") || t.includes("kuku") || t.includes("farming")){
   return "Shamba Litein poa! 🌽\nMahindi: 20 bags per acre\nKienyeji: profit 300\nMaziwa 45/L\nUnalima nini?";
 }

 if(t.includes("asante") || t.includes("thanks") || t.includes("thank you")){
   return "Karibu sana boss! 🙏 Mwananchi V21 always hapa!";
 }

 // Default but SMART - not generic like V20
 return `Sawa bro, umesema '${text}' — niko!\nMimi ni Mwananchi V21, najua:\n• Mayai Litein 2026\n• Biashara\n• Computer\n• Shamba\n\nUliza 'who are you' ama 'mayai 5 tray'`;
}

function ask(){
 const el=document.getElementById('q'); let text=el.value.trim(); if(!text) return;
 addMsg(text,'user'); el.value='';
 addMsg(getAnswer(text),'bot');
}
function addMsg(t,c){ const d=document.getElementById('chat'); const div=document.createElement('div'); div.className='msg '+c; div.innerText=t; d.appendChild(div); d.scrollTop=d.scrollHeight; }
addMsg("Poa bro! V21 ULTIMATE 🌍\n✅ Fixed 'Hello' bug\n✅ Fixed 'How made you' bug\n✅ No password, no limit\n\nJaribu sasa 'Hello' na 'How made you' — zote zitajibu vizuri!","bot");
</script>
</body>
</html>
